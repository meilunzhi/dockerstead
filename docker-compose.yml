services:
  nginx:
    build:
      context: ./services/nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - ${NGINX_SSL_CERTIFICATE_DIR}:/ssl
      - ${NGINX_CONFD_DIR}:/etc/nginx/conf.d
      - ${NGINX_CONF_FILE}:/etc/nginx/nginx.conf
      - ${NGINX_FASTCGI_PHP_CONF}:/etc/nginx/fastcgi-php.conf
      - ${NGINX_FASTCGI_PARAMS}:/etc/nginx/fastcgi_params
      - ${NGINX_LOG_DIR}:/var/log/nginx
    restart: always
    networks:
      - default
#it-tools
  it-tools:
    build:
      context: ./services/it-tools
    image: sharevb/it-tools:latest
    container_name: it-tools
    ports:
      - 8080:8080
    volumes:
      - ${SOURCE_DIR}:/www/:rw
    restart: always
    networks:
      - default
#FrankenPHP83
  frankenphp83:
    build:
      context: ./services/frankenphp/php83
    container_name: frankenphp83
    ports:
      - "${FRANKENPHP83_HTTP_PORT}:80"
      - "${FRANKENPHP83_HTTPS_PORT}:443"
      - "${FRANKENPHP83_ADMIN_PORT}:8023"
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - /www/api/bgrf_market/vendor
      - ${FRANKENPHP83_CADDYFILE}:/etc/caddy/Caddyfile:ro
      - ${FRANKENPHP83_DATA_DIR}:/data/caddy:rw
      - ${FRANKENPHP83_LOG_DIR}:/var/log/caddy:rw
    environment:
      TZ: "$TZ"
    restart: always
    networks:
      - default
#PHP84
  php84:
    build:
      context: ./services/php84
      args:
        PHP_VERSION: php:8.4.23-fpm-alpine
        CONTAINER_PACKAGE_URL: ${CONTAINER_PACKAGE_URL}
        COMPOSER_URL: ${COMPOSER_URL}
        PHP_EXTENSIONS: ${PHP84_EXTENSIONS}
        TZ: "$TZ"
    container_name: php84
    expose:
      - 9501
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - ${PHP84_PHP_CONF_FILE}:/usr/local/etc/php/php.ini
      - ${PHP84_FPM_CONF_FILE}:/usr/local/etc/php-fpm.d/www.conf
      - ${PHP84_LOG_DIR}:/var/log/php
      - ${PHP84_DATA_COMPOSER}:/tmp/composer
    restart: always
    cap_add:
      - SYS_PTRACE
    networks:
        - default
#PHP83
  php83:
    build:
      context: ./services/php83
      args:
        PHP_VERSION: php:8.3.32-fpm-alpine
        CONTAINER_PACKAGE_URL: ${CONTAINER_PACKAGE_URL}
        COMPOSER_URL: ${COMPOSER_URL}
        PHP_EXTENSIONS: ${PHP83_EXTENSIONS}
        TZ: "$TZ"
    container_name: php83
    expose:
      - 9501
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - /www/api/bgrf_market/vendor
      - ${PHP83_PHP_CONF_FILE}:/usr/local/etc/php/php.ini
      - ${PHP83_FPM_CONF_FILE}:/usr/local/etc/php-fpm.d/www.conf
      - ${PHP83_LOG_DIR}:/var/log/php
      - ${PHP83_DATA_COMPOSER}:/tmp/composer
    restart: always
    cap_add:
      - SYS_PTRACE
    networks:
        - default
#PHP74
  php74:
    build:
      context: ./services/php74
      args:
        PHP_VERSION: php:${PHP74_VERSION}-fpm-alpine
        CONTAINER_PACKAGE_URL: ${CONTAINER_PACKAGE_URL}
        COMPOSER_URL: ${COMPOSER_URL}
        PHP_EXTENSIONS: ${PHP74_EXTENSIONS}
        TZ: "$TZ"
    container_name: php74
    expose:
      - 9501
    extra_hosts:
      - "www.site1.com:172.17.0.1"
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - /www/api/ycsAuto/vendor
      - ${PHP74_PHP_CONF_FILE}:/usr/local/etc/php/php.ini:ro
      - ${PHP74_FPM_CONF_FILE}:/usr/local/etc/php-fpm.d/www.conf:rw
      - ${PHP74_LOG_DIR}:/var/log/php
      - ${DATA_DIR}/composer:/tmp/composer
    restart: always
    cap_add:
      - SYS_PTRACE
    networks:
      - default
  # mysql 8.0.46
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql:/var/lib/mysql/:rw
      - ${MYSQL_LOG_DIR}:/var/log/mysql/:rw
    restart: always
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_ROOT_HOST}"
      TZ: "$TZ"
  # mysql 5.7.44
  mysql5:
 #  platform: linux/amd64  # 指定使用 amd64 平台,mac芯片m1-m4需要打开
    image: mysql:${MYSQL5_VERSION}
    container_name: mysql5
    ports:
      - "${MYSQL5_HOST_PORT}:3306"
    volumes:
      - ${MYSQL5_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql5:/var/lib/mysql/:rw
      - ${MYSQL5_LOG_DIR}:/var/log/mysql/:rw
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL5_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL5_ROOT_HOST}"
      TZ: "$TZ"
#Redis
  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - ${REDIS_CONF_FILE}:/etc/redis.conf:ro
      - ${DATA_DIR}/redis:/data/:rw
    restart: always
    entrypoint: ["redis-server", "/etc/redis.conf"]
    environment:
      TZ: "$TZ"
    networks:
      - default
#Memcached
  memcached:
    image: memcached:${MEMCACHED_VERSION}
    container_name: memcached
    ports:
      - "${MEMCACHED_HOST_PORT}:11211"
    environment:
      MEMCACHED_CACHE_SIZE: "${MEMCACHED_CACHE_SIZE}"
    networks:
      - default

